<!DOCTYPE html>
<html dir="{S_CONTENT_DIRECTION}" lang="{S_USER_LANG}">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="robots" content="noindex" />
<title>{SITENAME} :: {PAGE_TITLE}</title>

<link rel="stylesheet" href="{T_THEME_PATH}/printview.css" type="text/css" />
<!-- EVENT ucp_pm_viewmessage_print_head_append -->
</head>

<body class="{S_CONTENT_DIRECTION}">

<big><big><b>{SITENAME}</b></big></big>

<br />

<small>{SITE_DESCRIPTION}<br />{L_PRIVATE_MESSAGING}</small>

<br /><br />

<big><b>{SUBJECT}</b></big>

<table class="mini" width="100%" cellspacing="3">
<tr>
	<td>&nbsp;</td>
	<td align="{S_CONTENT_FLOW_END}">{PAGE_NUMBER}</td>
</tr>
</table>

{L_PM_FROM}{L_COLON} <b>{MESSAGE_AUTHOR}</b> [ {SENT_DATE} ]

<!-- IF S_TO_RECIPIENT -->
	<br />{L_TO}{L_COLON}
	<!-- BEGIN to_recipient -->
		<b>{to_recipient.NAME}</b>&nbsp;
	<!-- END to_recipient -->
<!-- ENDIF -->
<!-- IF S_BCC_RECIPIENT -->
	<br />{L_BCC}{L_COLON}
	<!-- BEGIN bcc_recipient -->
		<b>{bcc_recipient.NAME}</b>&nbsp;
	<!-- END bcc_recipient -->
<!-- ENDIF -->

<br /><br />

<div class="printable-content">{MESSAGE}</div>

<hr noshade="noshade" size="1" />

<table class="mini" width="100%" cellspacing="3">
<tr valign="top">
	<td>{CREDIT_LINE}<!-- IF TRANSLATION_INFO --><br />{TRANSLATION_INFO}<!-- ENDIF --></td>
	<td align="{S_CONTENT_FLOW_END}">{S_TIMEZONE}<br />{PAGE_NUMBER}</td>
</tr>
</table>

</body>
</html>
