<!DOCTYPE html>
<html dir="{S_CONTENT_DIRECTION}" lang="{S_USER_LANG}">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="robots" content="noindex" />
<title>{SITENAME} :: {PAGE_TITLE}</title>

<link rel="stylesheet" href="{T_THEME_PATH}/printview.css" type="text/css" />
<!-- EVENT viewtopic_print_head_append -->
</head>

<body class="{S_CONTENT_DIRECTION}">

<big><big><b>{SITENAME}</b></big></big>

<br />

<small>{SITE_DESCRIPTION}<br /><a href="{U_FORUM}">{U_FORUM}</a></small>

<br /><br />

<big><b>{TOPIC_TITLE}</b></big><br /><small><a href="{U_TOPIC}">{U_TOPIC}</a></small>

<table class="mini" width="100%" cellspacing="3">
<tr>
	<td>&nbsp;</td>
	<td align="{S_CONTENT_FLOW_END}">{PAGE_NUMBER}</td>
</tr>
</table>

<!-- BEGIN postrow -->

	{L_AUTHOR}{L_COLON} <b>{postrow.POST_AUTHOR}</b> [ {postrow.POST_DATE} ]

	<br />

	{L_POST_SUBJECT}{L_COLON} <b>{postrow.POST_SUBJECT}</b>

	<br /><br />

	<div class="printable-content">{postrow.MESSAGE}</div>

	<hr noshade="noshade" size="1" />
<!-- END postrow -->

<table class="mini" width="100%" cellspacing="3">
<tr valign="top">
	<td>{CREDIT_LINE}<!-- IF TRANSLATION_INFO --><br />{TRANSLATION_INFO}<!-- ENDIF --></td>
	<td align="{S_CONTENT_FLOW_END}">{S_TIMEZONE}<br />{PAGE_NUMBER}</td>
</tr>
</table>

</body>
</html>
